# Local-only foundation project. No remote project is linked by this configuration.
project_id = "pikas-activation"
[api]
enabled = true
port = 55541
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55542
shadow_port = 55540
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./fixtures/foundation.sql"]
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[realtime]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/activar"]
enable_signup = false

[auth.email]
# Enable email/password provider; public signup remains disabled by auth.enable_signup.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 3600
[edge_runtime]
enabled = false
[analytics]
enabled = false
