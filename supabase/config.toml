# Local-only foundation project. No remote project is linked by this configuration.
project_id = "pikas-foundation"
[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55432
shadow_port = 55430
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./fixtures/foundation.sql"]
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[realtime]
enabled = false
[auth]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
